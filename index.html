<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>초깔끔 판서장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
        font-family: 'KyoboHand';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/KyoboHand.woff') format('woff');
        font-weight: normal; font-style: normal;
    }
    @font-face {
        font-family: 'EBSHunminjeongeumSB';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2110@1.0/EBSHunminjeongeumSB.woff2') format('woff2');
        font-weight: normal; font-style: normal;
    }
    
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    
    /* 텍스트 입력창 스타일: 외곽선 제거, 스크롤바 숨김 */
    #board-textarea {
      width: 100vw; height: 100vh; padding: 40px; border: none; resize: none; outline: none;
      background-color: transparent; font-family: 'Noto Sans KR', sans-serif;
      line-height: 1.6; transition: background-color 0.3s, color 0.3s;
    }
    #board-textarea::-webkit-scrollbar { display: none; }

    /* 숨김형 톱니바퀴 버튼 */
    #settings-btn {
      position: fixed; top: 20px; right: 20px; opacity: 0; transition: opacity 0.3s;
      background: rgba(0,0,0,0.1); border-radius: 50%; padding: 10px; cursor: pointer;
    }
    body:hover #settings-btn { opacity: 1; }
    #settings-btn:hover { background: rgba(0,0,0,0.2); }
  </style>
</head>
<body id="board-body" class="bg-white text-gray-900">

  <!-- 판서 영역 -->
  <textarea id="board-textarea" placeholder="여기에 내용을 입력하세요..." spellcheck="false"></textarea>

  <!-- 설정 버튼 -->
  <div id="settings-btn" title="설정">
    <svg width="28" height="28" fill="currentColor" viewBox="0 0 16 16" class="text-gray-600">
      <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>
      <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/>
    </svg>
  </div>

  <!-- 설정 패널 (모달) -->
  <div id="settings-panel" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full mx-4">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-2xl font-bold">판서장 설정</h3>
        <button id="close-settings" class="text-2xl text-gray-500 hover:text-gray-800">✕</button>
      </div>
      
      <div class="space-y-5">
        <div>
          <label class="block text-sm font-semibold mb-2">폰트 변경</label>
          <select id="font-select" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
            <option value="Noto Sans KR">기본 고딕 (Noto Sans)</option>
            <option value="KyoboHand">교보 손글씨</option>
            <option value="EBSHunminjeongeumSB">EBS 훈민정음체</option>
          </select>
        </div>
        
        <div>
          <label class="block text-sm font-semibold mb-2">글씨 크기: <span id="size-value">60</span>px</label>
          <input type="range" id="size-slider" min="20" max="150" value="60" class="w-full">
        </div>

        <div class="flex gap-4">
          <div class="flex-1">
            <label class="block text-sm font-semibold mb-2">글씨 색상</label>
            <input type="color" id="text-color" value="#111827" class="w-full h-10 border-0 rounded cursor-pointer p-0">
          </div>
          <div class="flex-1">
            <label class="block text-sm font-semibold mb-2">배경 색상</label>
            <input type="color" id="bg-color" value="#ffffff" class="w-full h-10 border-0 rounded cursor-pointer p-0">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const textarea = document.getElementById('board-textarea');
    const body = document.getElementById('board-body');
    const settingsBtn = document.getElementById('settings-btn');
    const settingsPanel = document.getElementById('settings-panel');
    const closeSettings = document.getElementById('close-settings');
    
    const fontSelect = document.getElementById('font-select');
    const sizeSlider = document.getElementById('size-slider');
    const sizeValue = document.getElementById('size-value');
    const textColor = document.getElementById('text-color');
    const bgColor = document.getElementById('bg-color');

    // 설정창 열고 닫기
    settingsBtn.addEventListener('click', () => settingsPanel.classList.remove('hidden'));
    closeSettings.addEventListener('click', () => settingsPanel.classList.add('hidden'));

    // 스타일 적용 함수
    function applyStyles() {
      textarea.style.fontFamily = `"${fontSelect.value}", sans-serif`;
      textarea.style.fontSize = `${sizeSlider.value}px`;
      textarea.style.color = textColor.value;
      textarea.style.backgroundColor = bgColor.value;
      body.style.backgroundColor = bgColor.value; // 전체 배경색 맞춤
      
      // 설정 저장
      localStorage.setItem('boardFont', fontSelect.value);
      localStorage.setItem('boardSize', sizeSlider.value);
      localStorage.setItem('boardTextColor', textColor.value);
      localStorage.setItem('boardBgColor', bgColor.value);
    }

    // 텍스트 저장 함수
    textarea.addEventListener('input', () => {
      localStorage.setItem('boardText', textarea.value);
    });

    // 이벤트 리스너 연결
    fontSelect.addEventListener('change', applyStyles);
    sizeSlider.addEventListener('input', (e) => {
      sizeValue.textContent = e.target.value;
      applyStyles();
    });
    textColor.addEventListener('input', applyStyles);
    bgColor.addEventListener('input', applyStyles);

    // 초기 로딩 시 저장된 설정 불러오기
    window.addEventListener('load', () => {
      if(localStorage.getItem('boardText')) textarea.value = localStorage.getItem('boardText');
      if(localStorage.getItem('boardFont')) fontSelect.value = localStorage.getItem('boardFont');
      if(localStorage.getItem('boardSize')) {
        sizeSlider.value = localStorage.getItem('boardSize');
        sizeValue.textContent = localStorage.getItem('boardSize');
      }
      if(localStorage.getItem('boardTextColor')) textColor.value = localStorage.getItem('boardTextColor');
      if(localStorage.getItem('boardBgColor')) bgColor.value = localStorage.getItem('boardBgColor');
      
      applyStyles();
    });
  </script>
</body>
</html>
